name: Flutter Analyze

on:
  push:
    branches:
      - '**'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: dart pub get

      - name: Run analyze
        id: analyze
        run: |
          set +e
          dart analyze --format=machine > analyze_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat analyze_output.txt

      - name: Report findings
        if: always()
        run: |
          {
            echo "## Dart Analyze Findings"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s analyze_output.txt ]; then
            echo "No issues found." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "| Severity | File | Line | Message |"
              echo "|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            while IFS='|' read -r severity type name file line column length message; do
              [ -z "$severity" ] && continue

              case "$severity" in
                ERROR) gh_level=error ;;
                WARNING) gh_level=warning ;;
                *) gh_level=notice ;;
              esac

              echo "::${gh_level} file=${file},line=${line},col=${column}::${message} (${name})"
              echo "| ${severity} | ${file} | ${line} | ${message} |" >> "$GITHUB_STEP_SUMMARY"
            done < analyze_output.txt
          fi

      - name: Upload analyze report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-analyze-report
          path: analyze_output.txt

      - name: Fail if analyze reported errors
        if: steps.analyze.outputs.exit_code != '0'
        run: exit 1
